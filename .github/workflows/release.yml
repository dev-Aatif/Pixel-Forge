name: GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK Platform, Build Tools, CMake & NDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Download NCNN Android Vulkan prebuilt
        run: |
          mkdir -p /tmp/ncnn app/src/main/jniLibs/arm64-v8a
          curl -fsSL "https://github.com/Tencent/ncnn/releases/download/20260113/ncnn-20260113-android-vulkan.zip" -o /tmp/ncnn.zip
          unzip -q /tmp/ncnn.zip -d /tmp/ncnn
          SRC_DIR=$(find /tmp/ncnn -maxdepth 3 -type d -name arm64-v8a | head -n 1)
          cp -r "$SRC_DIR"/* app/src/main/jniLibs/arm64-v8a/

      - name: Decode and validate release keystore
        id: keystore
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.RELEASE_STORE_PASSWORD }}" ] || [ -z "${{ secrets.RELEASE_KEY_ALIAS }}" ] || [ -z "${{ secrets.RELEASE_KEY_PASSWORD }}" ]; then
            echo "::error::Missing release signing secrets (RELEASE_KEYSTORE_BASE64 / RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD)."
            exit 1
          fi
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks
          echo "RELEASE_KEYSTORE_PATH=/tmp/release.jks" >> "$GITHUB_ENV"

      - name: Run unit tests and build release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Verify APK signature and prepare release artifacts
        run: |
          mkdir -p dist
          if ls app/build/outputs/apk/release/*-unsigned.apk >/dev/null 2>&1; then
            echo "::error::Unsigned APK generated; refusing to publish."
            exit 1
          fi
          cp app/build/outputs/apk/release/*.apk dist/
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          for apk in dist/*.apk; do
            "$APKSIGNER" verify --verbose "$apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
