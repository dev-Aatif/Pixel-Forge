name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install CMake & NDK
        run: |
          sdkmanager --install "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Download NCNN Android Vulkan prebuilt
        run: |
          mkdir -p /tmp/ncnn app/src/main/jniLibs/arm64-v8a
          curl -fsSL "https://github.com/Tencent/ncnn/releases/download/20260113/ncnn-20260113-android-vulkan.zip" -o /tmp/ncnn.zip
          unzip -q /tmp/ncnn.zip -d /tmp/ncnn
          SRC_DIR=$(find /tmp/ncnn -maxdepth 3 -type d -name arm64-v8a | head -n 1)
          cp -r "$SRC_DIR"/* app/src/main/jniLibs/arm64-v8a/

      - name: Run unit tests, native build, lint, and R8 release verification
        run: ./gradlew testDebugUnitTest externalNativeBuildDebug lintDebug assembleRelease
